[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-tag-doctor"
version = "1.0.0"
description = "Audit a support ticket CSV export for tag hygiene"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
ticket-tag-doctor = "ticket_tag_doctor:main_entry"

[tool.setuptools]
py-modules = ["ticket_tag_doctor"]
